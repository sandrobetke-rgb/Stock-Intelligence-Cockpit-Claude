name: Daten-Pipeline & Deployment

on:
  schedule:
    # Boersentage nach US-Boersenschluss: 16:00 ET = 20:00 UTC (Sommerzeit) bzw. 21:00 UTC (Winterzeit).
    # 21:40 UTC liegt in beiden Faellen nach Handelsschluss.
    - cron: "40 21 * * 1-5"
    # Morgenlauf mit Tagesbericht: 05:15 UTC = 06:15 MEZ / 07:15 MESZ (ohne Kurse/Fundamentaldaten)
    - cron: "15 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full | no-fetch (nur CSV/Zustand neu auswerten)"
        default: full
  push:
    branches: [main]
    paths: ["frontend/**", "backend/data/imports/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Abhaengigkeiten
        run: pip install -r backend/requirements.txt
      - name: Tests (Abnahmekriterien)
        working-directory: backend
        run: python -m pytest -q
      - name: Cache fuer Fundamentaldaten
        uses: actions/cache@v4
        with:
          path: backend/data/cache
          key: sic-cache-${{ github.run_id }}
          restore-keys: sic-cache-
      - name: Pipeline
        working-directory: backend
        env:
          SIC_USER_AGENT: ${{ secrets.SIC_USER_AGENT }}
          # optional (kostenlos): eigener Reddit-Zugang und OpenFIGI-Schlüssel
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          # Alarme (optional): Push über ntfy.sh, E-Mail über SMTP
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          # Adresse für Links in Push/E-Mail: Variable COCKPIT_URL (z. B. Cloudflare), sonst GitHub Pages
          COCKPIT_URL: ${{ vars.COCKPIT_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          ARGS=""
          # Push/CSV-Aenderung: nur neu auswerten. Ohne vorhandenes Universum (erster Lauf) immer voll abrufen.
          if [ -f data/state/universe.json ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.mode }}" = "no-fetch" ]; }; then ARGS="--no-fetch"; fi
          if [ "${{ github.event.schedule }}" = "15 5 * * 1-5" ]; then ARGS="--morning"; fi
          python -m sic.run $ARGS
      - name: Zustand und Daten committen
        run: |
          git config user.name "sic-bot"
          git config user.email "sic-bot@users.noreply.github.com"
          # Erzeugte Daten sichern, auf den neuesten Stand von main wechseln und die Daten dieses
          # Laufs vollstaendig uebernehmen (kein zeilenweises Mischen von JSON-Dateien).
          TMP=$(mktemp -d)
          cp -a backend/data/state "$TMP/state"
          cp -a frontend/public/data "$TMP/pubdata"
          git fetch origin main
          git checkout -f -B main origin/main
          rm -rf backend/data/state frontend/public/data
          cp -a "$TMP/state" backend/data/state
          cp -a "$TMP/pubdata" frontend/public/data
          git add -A backend/data/state frontend/public/data
          git diff --cached --quiet || git commit -m "Daten-Update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
      - name: Logs bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: backend/data/state

  target:
    # Cloudflare Pages (mit Zugangsschutz), sobald CLOUDFLARE_API_TOKEN gesetzt ist; sonst GitHub Pages
    needs: data
    if: always() && needs.data.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ steps.t.outputs.cloudflare }}
    steps:
      - id: t
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "cloudflare=$([ -n "$CF" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-cloudflare:
    needs: target
    if: always() && needs.target.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'sic-cockpit' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /
          VITE_REPO: ${{ github.repository }}
        run: |
          npm ci
          npm run build
      - name: Deploy zu Cloudflare Pages
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy frontend/dist --project-name "$CF_PROJECT" --branch main --commit-dirty=true

  deploy:
    needs: target
    if: always() && needs.target.outputs.cloudflare == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO: ${{ github.repository }}
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
